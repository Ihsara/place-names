<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fossils in the Map — Place Names of Finland & Vietnam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <h1>Fossils in the Map</h1>
    <nav class="worlds" role="tablist" aria-label="world">
      <button class="world is-active" data-world="nordic" role="tab">Nordic</button>
      <button class="world" data-world="vietnam" role="tab">Vietnam</button>
    </nav>
  </header>

  <div class="subnav">
    <nav class="tabs" id="country-tabs" role="tablist" aria-label="map"><!-- injected --></nav>
    <div class="lens-toggle" id="lens-toggle" role="group" aria-label="lens"><!-- injected --></div>
  </div>

  <!-- One reused map (left) + an attached story panel (right); a click-stepper
       drives the map (no scroll-jack). On mobile the two stack. -->
  <main class="story">
    <figure class="map-stage">
      <svg id="map" aria-label="Place-name map"></svg>
      <figcaption id="map-caption" class="map-caption"></figcaption>
    </figure>
    <aside class="panel" id="panel">
      <div id="step-body" class="step-body"><!-- current step card --></div>
      <div class="step-nav">
        <button id="prev" class="step-btn" aria-label="previous step">&lsaquo;</button>
        <div id="step-count" class="step-count"></div>
        <button id="next" class="step-btn" aria-label="next step">&rsaquo;</button>
      </div>
    </aside>
  </main>

  <footer class="footnote">
    <p>Place names are fossils. <strong>The Nordic land names what it sees; Vietnam names the order it imposes — and older tongues show through where one province names the world its own way.</strong></p>
    <p class="src">Data: OpenStreetMap settlements + admin boundaries via osmkit. Morphemes curated; see <a href="methodology.html">methodology</a>.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
