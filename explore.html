<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Explorer — Fossils in the Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <style>
    #explore-wrap { display: flex; min-height: 100vh; }
    #rail { width: 280px; min-width: 280px; padding: 1.2rem 1rem; background: var(--panel); overflow-y: auto; display: flex; flex-direction: column; gap: .6rem; }
    #map-area { flex: 1; position: relative; min-height: 400px; }
    #status { position: absolute; top: 1rem; left: 1rem; color: var(--muted); font-size: .9rem; }
    @media (max-width: 720px) {
      #explore-wrap { flex-direction: column; }
      #rail { width: auto; min-width: 0; }
    }
    /* Rail controls */
    .rail-title {
      font-family: 'Fraunces', serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--ink);
      margin: 0 0 .4rem;
      letter-spacing: .01em;
    }
    #rail label {
      display: flex;
      flex-direction: column;
      gap: .25rem;
      font-size: .78rem;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    #rail input[type="search"],
    #rail input[type="text"],
    #rail select {
      width: 100%;
      box-sizing: border-box;
      background: #0c1018;
      border: 1px solid #243355;
      color: var(--ink);
      border-radius: 4px;
      padding: .35rem .5rem;
      font-size: .85rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color .15s;
    }
    #rail input[type="search"]:focus,
    #rail input[type="text"]:focus,
    #rail select:focus {
      border-color: #3a6df0;
    }
    #rail input[type="range"] {
      width: 100%;
      accent-color: #3a6df0;
      cursor: pointer;
    }
    #rail label span#lat-val {
      display: inline;
      font-size: .85rem;
      color: var(--ink);
      font-weight: 400;
      font-family: 'Inter', sans-serif;
      text-transform: none;
      letter-spacing: 0;
    }
    #q-reset {
      margin-top: .2rem;
      padding: .4rem .9rem;
      background: transparent;
      border: 1px solid #3a6df0;
      color: #3a6df0;
      border-radius: 4px;
      font-size: .83rem;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      align-self: flex-start;
      transition: background .15s, color .15s;
    }
    #q-reset:hover { background: #3a6df0; color: #fff; }
    .count {
      font-size: .8rem;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      margin: 0;
    }
    /* Scoped to #map-area so it wins over app.css's global .tip (position:fixed; display:none). */
    #map-area .tip { position: absolute; pointer-events: none; background: #11151f;
           color: var(--ink); padding: .4rem .6rem; border-radius: 6px; font-size: .85rem;
           border: 1px solid #2a3142; max-width: 220px; }
  </style>
</head>
<body>
  <div id="explore-wrap">
    <aside id="rail">
      <h1 class="rail-title">The Explorer</h1>
      <label>Name contains<input id="q-name" type="search" placeholder="e.g. järvi" /></label>
      <label>Country
        <select id="q-country">
          <option value="">All</option>
          <option value="vietnam">Vietnam</option>
          <option value="finland">Finland</option>
          <option value="sweden">Sweden</option>
        </select>
      </label>
      <label>Family <select id="q-family"><option value="">All</option></select></label>
      <label>Stock <select id="q-stock"><option value="">All</option></select></label>
      <label>Fragment <input id="q-frag" type="text" placeholder="e.g. berg" /></label>
      <label>Latitude above <span id="lat-val">−90</span>°
        <input id="q-lat" type="range" min="-90" max="90" value="-90" step="1" /></label>
      <button id="q-reset">Reset</button>
      <p id="count" class="count"></p>
    </aside>
    <main id="map-area">
      <div id="status">Loading the query engine…</div>
      <svg id="map" width="100%" height="100%"></svg>
      <div id="tip" class="tip" style="display:none"></div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script type="module" src="explore.js"></script>
</body>
</html>
